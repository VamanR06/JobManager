<!doctype html><html><head><meta charset="utf-8"><title>Acme Careers - Apply</title></head><body>
<h1>Apply: Software Intern</h1>
<form id="app" onsubmit="event.preventDefault(); send();">
  <label for="first">First name</label><input id="first" required>
  <label for="em">Email</label><input id="em" type="email" required>
  <label for="cv">Resume</label><input id="cv" type="file" required>
  <label for="src">How did you hear about us?</label>
  <select id="src" required><option value="">Select…</option><option>LinkedIn</option><option>Career fair</option><option>Friend</option></select>
  <label for="why">Why Acme?</label><textarea id="why"></textarea>
  <button type="button" id="next">Save draft</button>
  <button type="submit">Submit Application</button>
</form>
<script>
  window.__sends = 0;
  function send() {
    window.__sends++;
    fetch("/submit", { method: "POST" }).then(() => {
      document.body.innerHTML = "<h1>Thank you for applying!</h1><p>Your application has been submitted.</p>";
    });
  }
</script>
</body></html>
